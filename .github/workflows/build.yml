name: Build Kanso APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true
      - name: Prepare Android Structure
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          mkdir -p app/src/main/java/com/example/kansolauncher
          mv .github/workflows/build.gradle.kts app/build.gradle.kts || mv build.gradle.kts app/build.gradle.kts
          mv .github/workflows/MainActivity.kt app/src/main/java/com/example/kansolauncher/MainActivity.kt || mv MainActivity.kt app/src/main/java/com/example/kansolauncher/MainActivity.kt
          python3 -c 'open("settings.gradle.kts", "w").write("pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = \"KansoLauncher\"\ninclude(\":app\")\n")'
          python3 -c 'open("build.gradle.kts", "w").write("plugins { id(\"com.android.application\") version \"8.2.0\" apply false; id(\"org.jetbrains.kotlin.android\") version \"1.9.20\" apply false }\n")'
          python3 -c 'a="android:"; xml=f"<?xml version=\"1.0\" encoding=\"utf-8\"?><manifest xmlns:android=\"http://android.com\"><uses-permission {a}name=\"android.permission.QUERY_ALL_PACKAGES\"/><application {a}label=\"Kanso\" {a}theme=\"@android:style/Theme.DeviceDefault.NoActionBar\"><activity {a}name=\".MainActivity\" {a}exported=\"true\" {a}launchMode=\"singleTask\" {a}stateNotNeeded=\"true\"><intent-filter><action {a}name=\"android.intent.action.MAIN\"/><category {a}name=\"android.intent.category.HOME\"/><category {a}name=\"android.intent.category.DEFAULT\"/><category {a}name=\"android.intent.category.LAUNCHER\"/></intent-filter></activity></application></manifest>"; open("app/src/main/AndroidManifest.xml","w").write(xml)'
      - name: Build APK
        run: gradle assembleDebug --refresh-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: KansoLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
